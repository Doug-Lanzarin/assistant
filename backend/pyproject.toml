[project]
name = "jarvis-backend"
version = "1.0.0"
description = "JARVIS — assistente pessoal com IA, automação residencial e segundo cérebro"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "../desktop"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM"]
# S608: SQL dinâmico só monta NOMES de colunas/placeholders a partir de listas fixas;
# valores são sempre parametrizados (revisado manualmente).
ignore = ["S101", "S104", "S311", "S603", "S607", "E501", "B008", "SIM105", "S110", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["app", "jarvis_agent"]
